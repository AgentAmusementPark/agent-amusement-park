services:
  - type: web
    name: agent-amusement-park
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CANONICAL_ORIGIN
        value: https://a2apark.com
      - key: CANONICAL_REDIRECT_HOSTS
        value: www.a2apark.com,agent-amusement-park.onrender.com
      - key: PARK_SHARE_SECRET
        generateValue: true
